<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account | Warung Mami</title>
    <link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="account.css">
    <style>
        /* ===== Avatar lokal (menggantikan gambar dari CDN) ===== */
        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid var(--brand);
            background: var(--tint);
            color: var(--brand-dk);
            display: flex;
            align-items: center;
            justify-content: center;
            /* flex adalah block-level: tanpa ini dia menempel di kiri (.not-login) */
            margin-inline: auto;
            overflow: hidden;
            flex: 0 0 auto;
        }

        .avatar .ico { width: 60px; height: 60px; }

        /* foto profil yang diunggah menutupi seluruh lingkaran, tanpa border ganda */
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: none;
            border-radius: 50%;
            display: block;
        }

        /* Baris nomor HP (di-set jadi flex oleh JS) */
        #phone {
            display: none;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
            font-size: 14px;
            color: var(--muted);
            text-align: center;
        }
        #phone:empty { display: none !important; }

        .edit-photo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
        }

        .profile-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .profile-actions button,
        .profile-actions a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid var(--line);
            background: #fff;
            color: var(--muted);
            text-decoration: none;
            cursor: pointer;
        }

        .profile-actions button:hover,
        .profile-actions a:hover { border-color: var(--brand); color: var(--brand-dk); }

        /* ===== Riwayat pesanan ===== */
        /* max-width & padding disamakan dengan .container (account.css) supaya sejajar */
        .orders { max-width: 420px; margin: 24px auto; padding: 0 20px; }
        .orders h3 { margin-bottom: 12px; display: flex; align-items: center; gap: 8px; font-weight: 600; }
        .order-card { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
        .order-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
        .order-code { font-weight: 700; color: var(--brand-dk); }
        .order-date { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
        .order-items { margin: 10px 0; font-size: 14px; color: var(--muted); }
        .order-items div { display: flex; justify-content: space-between; padding: 2px 0; }
        .order-total { display: flex; justify-content: space-between; border-top: 1px dashed var(--line); padding-top: 8px; font-weight: 700; color: var(--ink); }
        .order-discount { display: flex; justify-content: space-between; color: #1a7f37; font-size: 13.5px; padding: 2px 0; }
        .order-courier { font-size: 13px; color: var(--muted); margin-top: 6px; display: flex; align-items: center; gap: 6px; }
        .empty { text-align: center; color: var(--muted); padding: 30px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .empty > .ico { width: 40px; height: 40px; color: #d9d4cb; }
        .empty a .ico { width: 14px; height: 14px; vertical-align: -2px; }
        .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
        .badge-pending   { background: #fff3cd; color: #856404; }
        .badge-accepted  { background: #d1ecf1; color: #0c5460; }
        .badge-sending   { background: var(--tint); color: #b34700; }
        .badge-delivered { background: #d4edda; color: #155724; }
        .badge-cancelled { background: #f8d7da; color: #721c24; }

        .mini-links { max-width: 420px; margin: 0 auto 10px; padding: 0 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .mini-links a { display: inline-flex; align-items: center; gap: 7px; background: #fff; border: 1px solid var(--line); padding: 8px 14px; border-radius: var(--r-sm); font-size: 14px; text-decoration: none; color: var(--muted); box-shadow: var(--shadow); }
        .mini-links a:hover { border-color: var(--brand); color: var(--brand-dk); }
        .not-login { text-align: center; padding: 50px 20px; }
        .not-login a { color: var(--brand-dk); font-weight: 600; }

        /* ===== Modal ubah profil ===== */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(30, 25, 15, .45);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 999;
        }
        .modal-backdrop.hidden { display: none; }
        .modal {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            padding: 22px;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow-md);
        }
        .modal h3 { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-weight: 600; }
        .modal label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 12px; }
        .modal input {
            padding: 11px 13px;
            border: 1px solid var(--line);
            border-radius: var(--r-sm);
            font-size: 14px;
            outline: none;
            background: #fcfbf9;
        }
        .modal input:focus { border-color: var(--brand); background: #fff; box-shadow: 0 0 0 3px rgba(234, 152, 0, .15); }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
        .modal-actions button {
            padding: 10px 18px;
            border-radius: var(--r-sm);
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-cancel { background: #f3f1ec; color: var(--ink); }
        .btn-save { background: var(--brand); color: #fff; }
        .btn-save:hover { background: var(--brand-dk); }
        .btn-save:disabled { opacity: .6; cursor: default; }
        .modal .form-error { color: #d33; font-size: 13px; min-height: 16px; margin: 0 0 6px; }

        /* ===== Pemilih foto profil (file, bukan link) ===== */
        .avatar-pick {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--tint);
            border: 1px dashed var(--line);
            border-radius: var(--r-sm);
            padding: 10px 12px;
            margin-bottom: 14px;
        }
        .avatar-pick-img {
            width: 64px;
            height: 64px;
            flex: 0 0 auto;
            border-radius: 50%;
            border: 2px solid var(--brand);
            background: #fff;
            color: var(--brand-dk);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .avatar-pick-img img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
        .avatar-pick-img .ico { width: 26px; height: 26px; opacity: .7; }
        .avatar-pick-info { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--muted); }
        .avatar-pick-remove {
            align-self: flex-start;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: #d33;
            font-size: 12px;
            font-weight: 600;
            padding: 5px 12px;
        }
        .avatar-pick-remove:hover { border-color: #d33; }
        .modal input[type="file"] {
            font-size: 13px;
            padding: 9px 10px;
            background: #fff;
        }
        .modal input[type="file"]::file-selector-button {
            border: 1px solid var(--line);
            background: #f3f1ec;
            border-radius: var(--r-sm);
            padding: 5px 10px;
            margin-right: 10px;
            font: inherit;
            cursor: pointer;
        }

        /* ===== Chat modal responsive ===== */
        @media (max-width: 480px) {
            .modal-backdrop { padding: 0; }
            .chat-modal { height: 100dvh; max-height: 100dvh; border-radius: 0; max-width: 100%; }
        }
    </style>
</head>

<body>

<div class="container" id="profileArea">
    <div class="profile-card">
        <div class="profile-image">
            <div class="avatar"><i data-ico="user"></i></div>
            <button class="edit-photo" id="editProfileBtn" type="button" aria-label="Ubah data profil">
                <i data-ico="pencil"></i>
            </button>
        </div>
        <h2 id="username">Memuat...</h2>
        <p id="email">-</p>
        <p id="phone"></p>
        <p id="address" style="margin-top:4px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px;justify-content:center;"></p>
        <p id="roleTag" style="margin-top:6px;font-size:12px;"></p>
        <div class="profile-actions">
            <button type="button" id="editProfileBtn2"><i data-ico="pencil"></i> Ubah Profil</button>
            <a href="/index.html"><i data-ico="home"></i> Ke Toko</a>
        </div>
    </div>

    <div class="menu">
        <a href="#riwayat">
            <i data-ico="box"></i>
            <span>Riwayat Pesanan</span>
            <i data-ico="chevron-right"></i>
        </a>
        <a href="/index.html">
            <i data-ico="cart"></i>
            <span>Belanja Lagi</span>
            <i data-ico="chevron-right"></i>
        </a>
        <a id="roleLink" href="#" style="display:none;">
            <i data-ico="gauge"></i>
            <span id="roleLinkText">Panel</span>
            <i data-ico="chevron-right"></i>
        </a>
    </div>

    <button class="logout" type="button" id="logoutBtn"><i data-ico="logout"></i> Logout</button>
</div>

<div class="mini-links" id="miniLinks"></div>

<section class="orders" id="riwayat">
    <h3><i data-ico="box"></i> Riwayat Pesanan Saya</h3>
    <div id="ordersList"><div class="empty">Memuat...</div></div>
</section>

<!-- ===== Modal ubah profil ===== -->
<div class="modal-backdrop hidden" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
    <div class="modal">
        <h3 id="editModalTitle"><i data-ico="pencil"></i> Ubah Profil</h3>
        <label>Nama lengkap
            <input type="text" id="pfName" placeholder="Nama Anda" />
        </label>
        <label>Nomor HP / WhatsApp
            <input type="tel" id="pfPhone" placeholder="08xxxxxxxxxx" />
        </label>
        <label>Alamat Pengantaran
            <textarea id="pfAddress" rows="3" placeholder="Contoh: Jl. Mawar No. 12, RT 01/RW 02..." style="padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:14px;outline:none;background:#fcfbf9;font-family:inherit;resize:vertical;"></textarea>
        </label>
        <label>Wilayah Pengantaran
            <select id="pfArea" style="padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:14px;outline:none;background:#fcfbf9;font-family:inherit;cursor:pointer;"></select>
            <small style="font-size:12px;color:var(--muted);font-weight:400;">Menentukan biaya antar saat checkout.</small>
        </label>
        <label>Foto Profil
            <input type="file" id="pfAvatarFile" accept="image/jpeg,image/png,image/webp" />
        </label>
        <div class="avatar-pick">
            <div class="avatar-pick-img" id="pfAvatarPreview"><i data-ico="user"></i></div>
            <div class="avatar-pick-info">
                <span id="pfAvatarHint">JPG, PNG, atau WebP — maksimal 3 MB.</span>
                <button type="button" class="avatar-pick-remove" id="pfAvatarRemove" hidden>Hapus foto</button>
            </div>
        </div>
        <p class="form-error" id="pfError"></p>
        <div class="modal-actions">
            <button type="button" class="btn-cancel" id="pfCancel">Batal</button>
            <button type="button" class="btn-save" id="pfSave"><i data-ico="check"></i> Simpan</button>
        </div>
    </div>
</div>

<!-- ===== Modal Chat ===== -->
<div class="modal-backdrop hidden" id="chatModal" role="dialog" aria-modal="true" aria-labelledby="chatModalTitle">
    <div class="modal chat-modal" style="display:flex;flex-direction:column;height:80vh;max-height:600px;padding:0;overflow:hidden;">
        <div class="chat-modal-head">
            <h3 id="chatModalTitle" style="margin:0;display:flex;align-items:center;gap:8px;"><i data-ico="message-circle"></i> Chat Pesanan <span id="chatOrderCode" style="font-size:14px;opacity:.8;"></span></h3>
            <button type="button" onclick="closeChat()" style="background:transparent;border:none;color:#fff;cursor:pointer;"><i data-ico="x"></i></button>
        </div>
        <div id="chatMessages" style="flex:1;overflow-y:auto;padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:12px;">
            <!-- Pesan dari JS -->
        </div>
        <form id="chatForm" class="chat-modal-form">
            <input type="text" id="chatInput" placeholder="Ketik pesan..." autocomplete="off" required>
            <button type="submit"><i data-ico="send"></i></button>
        </form>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="account.js"></script>
</body>
</html>
